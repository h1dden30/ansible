---

  - name: Set timezone
    community.general.timezone:
      name: America/Detroit

  - name: Install packages
    ansible.builtin.apt:
      name:
      - btop
      - tmux
      - eza
      state: present

  - name: Install Starship
    ansible.builtin.shell: curl -sS https://starship.rs/install.sh | sh -s -- -y
    args:
     creates: /usr/local/bin/starship

  - name: Enable Starship in bashrc
    ansible.builtin.lineinfile:
     path: /home/ebadk/.bashrc
     line: 'eval "$(starship init bash)"'
     insertafter: EOF 

  - name: Ensure .config directory exists
    ansible.builtin.file:
      path: /home/ebadk/.config
      state: directory
      owner: ebadk
      group: ebadk
      mode: '0755'

  - name: Deploy Starship config
    ansible.builtin.copy:
      src: starship.toml
      dest: /home/ebadk/.config/starship.toml
      owner: ebadk
      group: ebadk
      mode: '0644'

  - name: Create ansible service account
    ansible.builtin.user:
     name: ansible-svc
     system: yes
     shell: /usr/sbin/nologin
     create_home: yes
     state: present

  - name: Change ansible-svc permissions
    ansible.builtin.copy:
     dest: /etc/sudoers.d/ansible-svc
     content: |
       ansible-svc ALL=(ALL) NOPASSWD: ALL
     owner: root
     group: root
     mode: '0440'
     validate: 'visudo -cf %s'

  - name: Deploy ansible-pull service unit
    ansible.builtin.copy:
     src: ansible-server-update.service
     dest: /etc/systemd/system/ansible-server-update.service
     owner: root
     group: root
     mode: '0644'
    notify: reload systemd

  - name: Deploy ansible-pull timer unit
    ansible.builtin.copy:
     src: ansible-server-update.timer
     dest: /etc/systemd/system/ansible-server-update.timer
     owner: root
     group: root
     mode: '0644'
    notify: reload systemd

  - name: Enable and start the timer
    ansible.builtin.systemd:
      name: ansible-server-update.timer
      enabled: true
      state: started
      daemon_reload: true

  - name: Disable root account
    ansible.builtin.user: 
      name: root
      password_lock: true
  
  - name: Deploy MOTD ASCII art
    ansible.builtin.copy:
     src: motd-art.txt
     dest: /etc/motd-art.txt
     owner: root
     group: root
     mode: '0644'

  - name: Deploy dynamic MOTD script
    ansible.builtin.copy:
     src: 99-custom-motd
     dest: /etc/update-motd.d/99-custom-motd
     owner: root
     group: root
     mode: '0755'

  - name: Disable default Ubuntu MOTD noise
    ansible.builtin.file:
     path: "/etc/update-motd.d/{{ item }}"
     mode: '0644'
    loop:
     - 00-header
     - 10-help-text
     - 50-motd-news
     - 91-release-upgrade
     - 60-unminimize
    ignore_errors: true 