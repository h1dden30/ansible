---
- name: Install Docker's official GPG key and repo
  block:
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker apt repo
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

- name: Install Docker Engine + Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker is running and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Clone netbox-docker
  ansible.builtin.git:
    repo: "{{ netbox_docker_repo }}"
    dest: "{{ netbox_install_dir }}"
    version: release  # netbox-docker's stable branch, not main/master
    force: false        # don't clobber local overrides on subsequent pulls

- name: Template netbox.env with vaulted secrets
  ansible.builtin.template:
    src: netbox.env.j2
    dest: "{{ netbox_install_dir }}/env/netbox.env"
    mode: '0600'
  notify: netbox compose up

- name: Template postgres.env with vaulted secrets
  ansible.builtin.template:
    src: postgres.env.j2
    dest: "{{ netbox_install_dir }}/env/postgres.env"
    mode: '0600'
  notify: netbox compose up

- name: Template redis.env with vaulted secrets
  ansible.builtin.template:
    src: redis.env.j2
    dest: "{{ netbox_install_dir }}/env/redis.env"
    mode: '0600'
  notify: netbox compose up

- name: Template docker-compose override (port binding, restart policy)
  ansible.builtin.template:
    src: docker-compose.override.yml.j2
    dest: "{{ netbox_install_dir }}/docker-compose.override.yml"
    mode: '0644'
  notify: netbox compose up

- name: Flush handlers so the compose up runs immediately, not at play end
  ansible.builtin.meta: flush_handlers
