---
- hosts: localhost
  become: true
  tasks:

  - name: Apply workstation role
    ansible.builtin.include_role:
      name: workstations
    when: "'wks' in ansible_facts['nodename']"

  - name: Apply server role
    ansible.builtin.include_role:
      name: servers
    when: "'srv' in ansible_facts['nodename']"