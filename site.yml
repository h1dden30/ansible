---
- hosts: localhost
  connection: local
  become: true
  tasks:

  - name: Create ansible service account
    ansible.builtin.user:
     name: ansible-svc
     system: yes
     shell: /usr/sbin/nologin
     create_home: no
     state: present

  - name: Change ansible-svc permissions
    ansible.builtin.copy:
     dest: /etc/sudoers.d/ansible-svc
     content: |
       ansible-svc ALL=(ALL) NOPASSWD: /usr/bin/apt, /usr/bin/apt-get, /bin/systemctl
     owner: root
     group: root
     mode: '0440'
     validate: 'visudo -cf %s'

  - name: Deploy MOTD ASCII art
    ansible.builtin.copy:
     src: motd-art.txt
     dest: /etc/motd-art.txt
     owner: root
     group: root
     mode: '0644'

  - name: Deploy dynamic MOTD script
    ansible.builtin.template:
     src: 99-custom-motd.j2
     dest: /etc/update-motd.d/99-custom-motd
     owner: root
     group: root
     mode: '0755'

  - name: Disable default Ubuntu MOTD noise
    ansible.builtin.file:
     path: "/etc/update-motd.d/{{ item }}"
     mode: '0644'
    loop:
     - 10-help-text
     - 50-motd-news
     - 91-release-upgrade
    ignore_errors: true 

  - name: Apply workstation role
    ansible.builtin.include_role:
      name: workstations
    when: "'wks' in ansible_facts['nodename']"

  - name: Apply server role
    ansible.builtin.include_role:
      name: servers
    when: "'srv' in ansible_facts['nodename']"