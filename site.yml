---
- hosts: localhost
  become: true
  
  vars_prompt:
  - name: password
    prompt: "Create password for ebadk"
    private: true

  tasks:

  - name: Add sudo user
    user: 
      name: ebadk
      password: "{{ password | password_hash('sha512') }}"
      group: sudo
      create_home: yes
      state: present

  - name: Apply workstation role
    ansible.builtin.include_role:
      name: workstations
    when: "'wks' in ansible_facts['nodename']"

  - name: Apply server role
    ansible.builtin.include_role:
      name: servers
    when: "'srv' in ansible_facts['nodename']"