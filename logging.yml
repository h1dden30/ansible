---
# Log ingestion stack: Grafana (UI) + Loki (storage) + Alloy (collector).
# Run on the log server:  ansible-playbook logging.yml
- hosts: localhost
  become: true

  vars:
    grafana_http_port: 3000
    loki_http_listen_address: 0.0.0.0
    loki_http_port: 3100
    loki_grpc_port: 9096
    loki_retention_period: 744h
    alloy_syslog_enabled: true
    alloy_syslog_listen: "0.0.0.0:1514"

  tasks:

  - name: Install and configure the log stack
    when: "'srv-log' in ansible_facts['nodename']"
    block:

    - name: Install apt prerequisites
      ansible.builtin.apt:
        name:
        - ca-certificates
        - gnupg
        state: present
        update_cache: true

    - name: Add Grafana apt repository
      ansible.builtin.deb822_repository:
        name: grafana
        types: deb
        uris: https://apt.grafana.com
        suites: stable
        components: main
        signed_by: https://apt.grafana.com/gpg.key
        state: present
      register: grafana_repo

    - name: Refresh apt cache after adding the repository
      ansible.builtin.apt:
        update_cache: true
      when: grafana_repo is changed

    - name: Install Grafana, Loki and Alloy
      ansible.builtin.apt:
        name:
        - grafana
        - loki
        - alloy
        state: present

    # Loki

    - name: Ensure Loki data directory exists
      ansible.builtin.file:
        path: /var/lib/loki
        state: directory
        owner: loki
        group: loki
        mode: '0750'

    - name: Deploy Loki configuration
      ansible.builtin.copy:
        dest: /etc/loki/config.yml
        owner: root
        group: loki
        mode: '0640'
        content: |
          auth_enabled: false

          server:
            http_listen_address: {{ loki_http_listen_address }}
            http_listen_port: {{ loki_http_port }}
            grpc_listen_port: {{ loki_grpc_port }}

          common:
            instance_addr: 127.0.0.1
            path_prefix: /var/lib/loki
            replication_factor: 1
            ring:
              kvstore:
                store: inmemory
            storage:
              filesystem:
                chunks_directory: /var/lib/loki/chunks
                rules_directory: /var/lib/loki/rules

          schema_config:
            configs:
            - from: "2024-01-01"
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: index_
                period: 24h

          limits_config:
            retention_period: {{ loki_retention_period }}
            allow_structured_metadata: true

          compactor:
            working_directory: /var/lib/loki/compactor
            retention_enabled: true
            delete_request_store: filesystem

          analytics:
            reporting_enabled: false
      notify: restart loki

    # Alloy

    - name: Allow the alloy user to read system logs and the journal
      ansible.builtin.user:
        name: alloy
        groups:
        - adm
        - systemd-journal
        append: true
      notify: restart alloy

    - name: Deploy Alloy configuration
      ansible.builtin.copy:
        dest: /etc/alloy/config.alloy
        owner: root
        group: alloy
        mode: '0640'
        content: |
          loki.write "default" {
            endpoint {
              url = "http://127.0.0.1:{{ loki_http_port }}/loki/api/v1/push"
            }
          }

          // systemd journal
          loki.relabel "journal" {
            forward_to = []

            rule {
              source_labels = ["__journal__systemd_unit"]
              target_label  = "unit"
            }

            rule {
              source_labels = ["__journal_priority_keyword"]
              target_label  = "level"
            }
          }

          loki.source.journal "journal" {
            max_age       = "12h"
            relabel_rules = loki.relabel.journal.rules
            labels        = {
              job  = "systemd-journal",
              host = constants.hostname,
            }
            forward_to    = [loki.write.default.receiver]
          }

          // plain-text files under /var/log
          local.file_match "varlogs" {
            path_targets = [{
              "__path__" = "/var/log/*.log",
              "job"      = "varlogs",
              "host"     = constants.hostname,
            }]
          }

          loki.source.file "varlogs" {
            targets    = local.file_match.varlogs.targets
            forward_to = [loki.write.default.receiver]
          }
          {% if alloy_syslog_enabled %}

          // remote syslog receiver (RFC 5424 over TCP)
          loki.source.syslog "remote" {
            listener {
              address       = "{{ alloy_syslog_listen }}"
              protocol      = "tcp"
              syslog_format = "rfc5424"
              labels        = { job = "syslog" }
            }
            forward_to = [loki.write.default.receiver]
          }
          {% endif %}
      notify: restart alloy

    # Grafana

    - name: Provision Loki as the default Grafana datasource
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/loki.yml
        owner: root
        group: grafana
        mode: '0640'
        content: |
          apiVersion: 1
          datasources:
          - name: Loki
            type: loki
            access: proxy
            url: http://127.0.0.1:{{ loki_http_port }}
            isDefault: true
            editable: false
      notify: restart grafana

    - name: Enable and start services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
      - loki
      - alloy
      - grafana-server

    - name: Apply pending restarts before verification
      ansible.builtin.meta: flush_handlers

    - name: Wait for Loki to report ready
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ loki_http_port }}/ready"
        return_content: true
      register: loki_ready
      until: loki_ready.status == 200
      retries: 12
      delay: 5
      changed_when: false

    - name: Wait for Grafana to report healthy
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ grafana_http_port }}/api/health"
      register: grafana_health
      until: grafana_health.status == 200
      retries: 12
      delay: 5
      changed_when: false

  handlers:

  - name: restart loki
    ansible.builtin.systemd:
      name: loki
      state: restarted

  - name: restart alloy
    ansible.builtin.systemd:
      name: alloy
      state: restarted

  - name: restart grafana
    ansible.builtin.systemd:
      name: grafana-server
      state: restarted
